name: Release APK

# Builds a debug-signed APK and attaches it to a GitHub Release whenever a
# version tag (e.g. v1.0.0) is pushed. This is a debug build suitable for
# personal testing/sideloading - see the disclaimer in README.md. A real
# Play Store release would additionally need a release signing config and
# keystore secrets, which are intentionally not set up here.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk "dulo-tv-${{ github.ref_name }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dulo-tv-${{ github.ref_name }}.apk
          body: |
            Debug-signed APK build for Dulo TV (${{ github.ref_name }}).
            Educational/personal use only - see README.md disclaimer.
